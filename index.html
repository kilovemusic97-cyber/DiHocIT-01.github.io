<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeonSo | IT Student & Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00ffc8;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a192f;
            color: #e2e8f0;
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 25, 47, 0.95);
            backdrop-filter: blur(12px);
            z-index: 1000;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #0a192f 0%, #1e3a5f 100%);
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            z-index: 2;
        }

        .hero-text h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4.5rem;
            line-height: 1.05;
        }

        .highlight {
            color: var(--primary);
        }

        #typing {
            font-size: 1.65rem;
            color: #a0d8ff;
            margin: 20px 0 30px 0;
        }

        .description {
            font-size: 1.2rem;
            max-width: 520px;
            opacity: 0.9;
        }

        .social-icons {
            display: flex;
            gap: 22px;
            margin-top: 40px;
        }

        .social-icons a {
            width: 58px;
            height: 58px;
            border: 2px solid rgba(0, 255, 200, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            transition: 0.4s;
        }

        .social-icons a:hover {
            background: var(--primary);
            color: #0a192f;
            transform: translateY(-10px);
        }

        .profile-img {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            border: 6px solid var(--primary);
            box-shadow: 0 0 70px rgba(0, 255, 200, 0.4);
        }

        canvas#particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-text h1 {
                font-size: 3.2rem;
            }
            .profile-img {
                width: 280px;
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">LeonSo</div>
        </nav>
    </header>

    <section class="hero">
        <canvas id="particles"></canvas>
        
        <div class="hero-content">
            <div class="hero-text">
                <h1>Xin chào, mình là <span class="highlight">LeonSo</span></h1>
                <div id="typing"></div>
                <p class="description">
                    Sinh viên Công nghệ Thông tin đam mê lập trình.<br>
                    Java • Arduino • WinForms
                </p>
                
                <div class="social-icons">
                    <a href="https://www.facebook.com/duyluve5.vvd" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.tiktok.com/@duyluve5.vvd" target="_blank"><i class="fab fa-tiktok"></i></a>
                    <a href="https://github.com/DiHocIT-01" target="_blank"><i class="fab fa-github"></i></a>
                </div>
            </div>
            
            <img src="https://via.placeholder.com/380" alt="LeonSo" class="profile-img">
        </div>
    </section>

    <script>
        // Typing Effect
        const texts = ["Java Developer", "Arduino Enthusiast", "WinForms Developer", "IT Student"];
        let count = 0, index = 0;

        function type() {
            if (count === texts.length) count = 0;
            let current = texts[count];
            let letter = current.slice(0, ++index);
            
            document.getElementById("typing").textContent = letter;
            
            if (letter.length === current.length) {
                count++;
                index = 0;
                setTimeout(type, 1800);
            } else {
                setTimeout(type, 70);
            }
        }
        type();

        // Particles
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speed = Math.random() * 0.8 + 0.3;
            }
            update() { this.y += this.speed; if (this.y > canvas.height) this.y = 0; }
            draw() {
                ctx.fillStyle = "#00ffc8";
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 160; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
