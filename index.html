<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeonSo | Bio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* ===== Gradient Background ===== */
body::before{
    content:"";
    position:absolute;
    width:400%;
    height:400%;
    background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#000000);
    background-size:400% 400%;
    animation:gradientMove 12s ease infinite;
    z-index:-3;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ===== Particle ===== */
canvas{
    position:absolute;
    z-index:-2;
}

/* ===== Card ===== */
.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    padding:45px 35px;
    border-radius:25px;
    width:360px;
    text-align:center;
    box-shadow:0 0 60px rgba(0,0,0,0.7);
    transition:0.4s;
}

.card:hover{
    transform:translateY(-8px) scale(1.02);
}

/* Avatar */
.card img{
    width:120px;
    border-radius:50%;
    margin-bottom:15px;
    border:3px solid rgba(255,255,255,0.5);
    box-shadow:0 0 20px rgba(0,255,200,0.6);
}

/* Name typing */
#typing{
    font-size:26px;
    font-weight:700;
    margin-bottom:5px;
    letter-spacing:1px;
}

/* Description */
p{
    font-size:14px;
    opacity:0.85;
    margin-bottom:20px;
}

/* Buttons */
a{
    display:block;
    padding:12px;
    margin:10px 0;
    border-radius:12px;
    text-decoration:none;
    font-weight:600;
    background:linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
    transition:0.3s;
}

a i{
    margin-right:8px;
}

a:hover{
    transform:scale(1.07);
    box-shadow:0 0 20px rgba(0,150,255,0.8);
}

/* Toggle */
.toggle{
    position:absolute;
    top:20px;
    right:20px;
    cursor:pointer;
    font-size:20px;
}

/* Light Mode */
.light{
    color:#222;
}

.light .card{
    background:rgba(255,255,255,0.9);
}

.light a{
    background:linear-gradient(45deg,#333,#555);
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleMode()">
    <i class="fa-solid fa-moon"></i>
</div>

<canvas id="particles"></canvas>

<div class="card">
    <img src="https://via.placeholder.com/130">
    <div id="typing"></div>
    <p>IT Student | Java | Arduino | WinForms</p>

    <a href="https://www.facebook.com/duyluve5.vvd" target="_blank">
        <i class="fa-brands fa-facebook"></i>Facebook
    </a>

    <a href="https://www.tiktok.com/@duyluve5.vvd" target="_blank">
        <i class="fa-brands fa-tiktok"></i>TikTok
    </a>

    <a href="https://github.com/DiHocIT-01" target="_blank">
        <i class="fa-brands fa-github"></i>GitHub
    </a>
</div>

<script>

/* ===== Dark Mode ===== */
function toggleMode(){
    document.body.classList.toggle("light");
}

/* ===== Typing Effect ===== */
const text = "LeonSo";
const typingElement = document.getElementById("typing");
let index = 0;

function typeEffect() {
    if (index < text.length) {
        typingElement.innerHTML += text.charAt(index);
        index++;
        setTimeout(typeEffect, 120);
    }
}
typeEffect();

/* ===== Particle Background (mượt hơn) ===== */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

for(let i=0;i<120;i++){
    particlesArray.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        size:Math.random()*2,
        speedY:Math.random()*1+0.3
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="rgba(0,255,200,0.7)";
    particlesArray.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        p.y+=p.speedY;

        if(p.y>canvas.height){
            p.y=0;
            p.x=Math.random()*canvas.width;
        }
    });
    requestAnimationFrame(animate);
}
animate();

/* Resize fix */
window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
