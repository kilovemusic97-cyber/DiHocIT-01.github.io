<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeonSo | IT Student & Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ffc8;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a192f;
            color: #e2e8f0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 25, 47, 0.95);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 255, 200, 0.1);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }

        /* Hero */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #0a192f 0%, #1e3a5f 100%);
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            z-index: 2;
        }

        .hero-text h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4.5rem;
            line-height: 1.05;
            margin-bottom: 16px;
        }

        .hero-text .highlight {
            color: var(--primary);
        }

        #typing {
            font-size: 1.6rem;
            color: #a0d8ff;
            margin-bottom: 30px;
            min-height: 50px;
        }

        .description {
            font-size: 1.15rem;
            max-width: 520px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .social-icons {
            display: flex;
            gap: 22px;
        }

        .social-icons a {
            width: 58px;
            height: 58px;
            border: 2px solid rgba(0, 255, 200, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            transition: all 0.4s ease;
        }

        .social-icons a:hover {
            background: var(--primary);
            color: #0a192f;
            transform: translateY(-10px);
        }

        .profile-img {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            border: 6px solid var(--primary);
            box-shadow: 0 0 70px rgba(0, 255, 200, 0.35);
            object-fit: cover;
        }

        canvas#particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        /* Contact */
        .contact {
            padding: 120px 40px;
            background: #05101f;
            text-align: center;
        }

        .contact h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            margin-bottom: 60px;
        }

        .contact-form {
            max-width: 680px;
            margin: 0 auto;
            background: rgba(255,255,255,0.06);
            padding: 50px;
            border-radius: 24px;
            border: 1px solid rgba(0,255,200,0.1);
        }

        input, textarea {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        button {
            padding: 16px 50px;
            background: var(--primary);
            color: #0a192f;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            background: #02070f;
            padding: 50px 0;
            text-align: center;
            font-size: 0.95rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-text h1 {
                font-size: 3.2rem;
            }
            .profile-img {
                width: 280px;
                height: 280px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <nav>
            <div class="logo">LeonSo</div>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
        <canvas id="particles"></canvas>
        
        <div class="hero-content">
            <div class="hero-text">
                <h1>Xin chào, mình là <span class="highlight">LeonSo</span></h1>
                <div id="typing"></div>
                <p class="description">
                    Sinh viên Công nghệ Thông tin đam mê mạng truyền thông.<br>
                    Java • Arduino • WinForms
                </p>
                
                <div class="social-icons">
                    <a href="https://www.facebook.com/duyluve5.vvd" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.tiktok.com/@duyluve5.vvd" target="_blank"><i class="fab fa-tiktok"></i></a>
                </div>
            </div>
            
            <img src="https://via.placeholder.com/380" alt="LeonSo Profile" class="profile-img">
        </div>
    </section>

    <!-- Contact -->
    <section class="contact">
        <h2>Liên hệ</h2>
        <div class="contact-form">
            <form>
                <input type="text" placeholder="Vo Vu Duy" required>
                <input type="email" placeholder="Kilovemusic97@gmail.com" required>
                <textarea placeholder="Nội dung tin nhắn" rows="6" required></textarea>
                <button type="button">Gửi tin nhắn</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 LeonSo • Made with ❤️</p>
    </footer>

    <script>
        // Typing Effect
        const texts = ["Java Developer", "Arduino Lover", "WinForms Developer", "IT Student"];
        let count = 0;
        let index = 0;
        let currentText = '';
        let letter = '';

        function type() {
            if (count === texts.length) count = 0;
            currentText = texts[count];
            letter = currentText.slice(0, ++index);
            
            document.getElementById("typing").textContent = letter;
            
            if (letter.length === currentText.length) {
                count++;
                index = 0;
                setTimeout(type, 1800);
            } else {
                setTimeout(type, 70);
            }
        }
        type();

        // Particles Background
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speed = Math.random() * 0.8 + 0.3;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = "#00ffc8";
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 160; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
