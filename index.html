<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeonSo | IT Student</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a192f, #1e3a5f, #0f2b4d);
        }

        /* Background Animation */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 30%, rgba(0, 255, 200, 0.08), transparent 50%);
            animation: bgMove 25s linear infinite;
            z-index: -3;
        }

        @keyframes bgMove {
            0% { transform: translate(-25%, -25%); }
            100% { transform: translate(25%, 25%); }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -2;
            opacity: 0.6;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 380px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 70px rgba(0, 255, 200, 0.15);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: 0.6s;
        }

        .card:hover::before {
            opacity: 1;
            top: -20%;
            left: -20%;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(0, 255, 200, 0.4);
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: 0.4s;
        }

        .card:hover .profile-img {
            border-color: #00ffc8;
            transform: scale(1.05);
        }

        #typing {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #a0d8ff;
            font-size: 15px;
            margin-bottom: 28px;
            opacity: 0.9;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .social-link:hover {
            background: rgba(0, 255, 200, 0.15);
            border-color: #00ffc8;
            transform: translateX(8px);
            color: #fff;
        }

        .toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            font-size: 22px;
            cursor: pointer;
            z-index: 10;
            padding: 8px;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="toggle" onclick="toggleMode()">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
    </div>

    <canvas id="particles"></canvas>

    <div class="card">
        <img src="https://via.placeholder.com/140" alt="LeonSo" class="profile-img">
        <div id="typing"></div>
        <p class="subtitle">IT Student • Java • Arduino • WinForms</p>

        <a href="https://www.facebook.com/duyluve5.vvd" target="_blank" class="social-link">
            <i class="fa-brands fa-facebook"></i>
            Facebook
        </a>
        <a href="https://www.tiktok.com/@duyluve5.vvd" target="_blank" class="social-link">
            <i class="fa-brands fa-tiktok"></i>
            TikTok
        </a>
        <a href="https://github.com/DiHocIT-01" target="_blank" class="social-link">
            <i class="fa-brands fa-github"></i>
            GitHub
        </a>
    </div>

    <script>
        // Typing Effect
        const text = "LeonSo";
        const typingElement = document.getElementById("typing");
        let index = 0;

        function typeEffect() {
            if (index < text.length) {
                typingElement.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeEffect, 120);
            }
        }
        typeEffect();

        // Particles
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let particlesArray = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = Math.random() * 0.8 + 0.3;
            }
            update() {
                this.y += this.speedY;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = "rgba(0, 255, 200, 0.7)";
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < 120; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();

        // Dark/Light Mode (có thể mở rộng sau)
        function toggleMode() {
            document.body.classList.toggle("light");
            const icon = document.getElementById("theme-icon");
            icon.classList.toggle("fa-moon");
            icon.classList.toggle("fa-sun");
        }
    </script>
</body>
</html>
